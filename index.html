<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Showroom Brand CRM</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel для компиляции JSX прямо в браузере -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const STAGES = [
      { id: 'lead', title: 'База / Планирую', short: 'База', color: 'bg-slate-100 text-slate-700 border-slate-300', dot: 'bg-slate-400' },
      { id: 'contacted', title: 'Написал (Оффер)', short: 'Написал', color: 'bg-blue-50 text-blue-700 border-blue-200', dot: 'bg-blue-500' },
      { id: 'replied', title: 'Ответили / Переговоры', short: 'Переговоры', color: 'bg-amber-50 text-amber-800 border-amber-200', dot: 'bg-amber-500' },
      { id: 'contract', title: 'Подписываем договор', short: 'Договор', color: 'bg-purple-50 text-purple-700 border-purple-200', dot: 'bg-purple-500' },
      { id: 'active', title: 'Выставлены в шоуруме', short: 'В шоуруме', color: 'bg-emerald-50 text-emerald-700 border-emerald-200', dot: 'bg-emerald-500' },
      { id: 'rejected', title: 'Отказ / Отложено', short: 'Отказ', color: 'bg-rose-50 text-rose-700 border-rose-200', dot: 'bg-rose-500' }
    ];

    const INITIAL_BRANDS = [
      { id: 'b-1', name: 'KRAKATAU', category: 'Techwear', contactName: 'Алексей', tgUsername: 'krakatau_b2b', phone: '+79991112233', stage: 'replied', railFormat: '2 рейла', monthlyFee: 35000, notes: 'Ждут фото зала' },
      { id: 'b-2', name: 'SHU', category: 'Базовая одежда', contactName: 'Мария', tgUsername: 'shu_clothes', phone: '+79265554433', stage: 'contract', railFormat: 'Корнер 4м²', monthlyFee: 45000, notes: 'Согласовали договор' },
      { id: 'b-3', name: 'ВОЛЧОК', category: 'Streetwear', contactName: 'Василий', tgUsername: 'volchok', phone: '+79034445566', stage: 'active', railFormat: '1 рейл', monthlyFee: 30000, notes: 'Выставлены в зале' }
    ];

    function App() {
      const [brands, setBrands] = useState(() => JSON.parse(localStorage.getItem('sm_crm_brands') || 'null') || INITIAL_BRANDS);
      const [token, setToken] = useState('8312776596:AAE0LlYuKisLzebdftj2fJaQ5571RSu5CBI');
      const [botActive, setBotActive] = useState(false);
      const [activeTab, setActiveTab] = useState('kanban');
      const [search, setSearch] = useState('');
      const [inputCommand, setInputCommand] = useState('');
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingBrand, setEditingBrand] = useState(null);

      useEffect(() => {
        localStorage.setItem('sm_crm_brands', JSON.stringify(brands));
      }, [brands]);

      useEffect(() => {
        if (window.Telegram && window.Telegram.WebApp) {
          window.Telegram.WebApp.ready();
          window.Telegram.WebApp.expand();
        }
        fetch(`https://api.telegram.org/bot${token}/getMe`)
          .then(res => res.json())
          .then(data => { if (data.ok) setBotActive(true); })
          .catch(() => setBotActive(false));
      }, [token]);

      const executeCommand = (text) => {
        if (!text.trim()) return;
        const lower = text.toLowerCase();
        if (lower.startsWith('добавь') || lower.startsWith('/add')) {
          const name = text.replace(/^(\/add|добавь бренд|добавь)\s*/i, '').split(/[,\s]/)[0] || 'Новый бренд';
          const tgMatch = text.match(/@([a-zA-Z0-9_]+)/);
          const phoneMatch = text.match(/(\+?[78]\d{10})/);
          const feeMatch = text.match(/(\d{2,3})\s*(к|тыс|000)/i);
          const newB = {
            id: 'b-' + Date.now(),
            name: name.toUpperCase(),
            category: 'Streetwear',
            contactName: '',
            tgUsername: tgMatch ? tgMatch[1] : '',
            phone: phoneMatch ? phoneMatch[1] : '',
            stage: 'lead',
            railFormat: '1 рейл',
            monthlyFee: feeMatch ? parseInt(feeMatch[1]) * 1000 : 30000,
            notes: `Добавлено текстом/голосом: "${text}"`
          };
          setBrands([newB, ...brands]);
          alert(`Бренд ${newB.name} успешно добавлен!`);
        } else if (lower.includes('договор')) {
          const b = brands.find(item => lower.includes(item.name.toLowerCase()));
          if (b) {
            setBrands(brands.map(item => item.id === b.id ? { ...item, stage: 'contract' } : item));
            alert(`Статус бренда ${b.name} изменен на: Договор`);
          }
        } else {
          alert(`Команда принята: "${text}". Для добавления напишите: «Добавь бренд Name @user +79990000000 30к»`);
        }
      };

      const handleSave = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const data = {
          id: editingBrand?.id || 'b-' + Date.now(),
          name: fd.get('name').trim(),
          category: fd.get('category').trim() || 'Одежда',
          contactName: fd.get('contactName').trim(),
          tgUsername: fd.get('tgUsername').trim().replace('@', ''),
          phone: fd.get('phone').trim(),
          stage: fd.get('stage'),
          railFormat: fd.get('railFormat').trim() || '1 рейл',
          monthlyFee: Number(fd.get('monthlyFee')) || 0,
          notes: fd.get('notes').trim()
        };
        if (editingBrand) {
          setBrands(brands.map(b => b.id === data.id ? data : b));
        } else {
          setBrands([data, ...brands]);
        }
        setIsModalOpen(false);
        setEditingBrand(null);
      };

      const activeRevenue = brands.filter(b => b.stage === 'active').reduce((sum, b) => sum + (Number(b.monthlyFee) || 0), 0);

      const filtered = brands.filter(b => 
        b.name.toLowerCase().includes(search.toLowerCase()) || 
        b.tgUsername.toLowerCase().includes(search.toLowerCase()) ||
        b.phone.includes(search)
      );

      return (
        <div className="max-w-[1400px] mx-auto p-4 sm:p-6 min-h-screen flex flex-col gap-4">
          {/* Шапка */}
          <header className="flex flex-wrap items-center justify-between gap-3 bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
            <div>
              <div className="flex items-center gap-2">
                <h1 className="text-lg font-bold">Showroom CRM</h1>
                <span className={`px-2 py-0.5 rounded-full text-xs font-semibold ${botActive ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}>
                  {botActive ? '● Бот онлайн' : '● Бот оффлайн'}
                </span>
              </div>
              <p className="text-xs text-slate-500">Выручка с активных рейлов: <b>{activeRevenue.toLocaleString('ru-RU')} ₽/мес</b></p>
            </div>
            <div className="flex items-center gap-2">
              <button onClick={() => { setEditingBrand(null); setIsModalOpen(true); }} className="px-3.5 py-2 bg-slate-900 text-white rounded-xl text-xs font-semibold hover:bg-slate-800">
                + Добавить бренд
              </button>
            </div>
          </header>

          {/* Быстрый голосовой/текстовый ввод */}
          <div className="bg-slate-900 text-white p-3 rounded-2xl flex items-center gap-2">
            <input 
              type="text" 
              value={inputCommand} 
              onChange={e => setInputCommand(e.target.value)}
              placeholder="Команда: «Добавь бренд OUTLAW @outlaw 35к» или «Волчок договор»..."
              className="flex-1 bg-slate-800 px-3.5 py-2 rounded-xl text-xs outline-none focus:ring-1 focus:ring-sky-400"
            />
            <button 
              onClick={() => {
                const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!Speech) return alert('Голосовой ввод не поддерживается в этом браузере');
                const rec = new Speech();
                rec.lang = 'ru-RU';
                rec.onresult = (e) => {
                  const txt = e.results[0][0].transcript;
                  setInputCommand(txt);
                  executeCommand(txt);
                };
                rec.start();
              }}
              className="px-3 py-2 bg-rose-600 text-white rounded-xl text-xs font-semibold"
            >
              🎙 Голос
            </button>
            <button onClick={() => { executeCommand(inputCommand); setInputCommand(''); }} className="px-3.5 py-2 bg-sky-600 text-white rounded-xl text-xs font-semibold">
              Ввод
            </button>
          </div>

          {/* Поиск и табы */}
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div className="flex gap-1 bg-slate-200/80 p-1 rounded-xl text-xs font-semibold">
              <button onClick={() => setActiveTab('kanban')} className={`px-3 py-1.5 rounded-lg ${activeTab === 'kanban' ? 'bg-white shadow-xs' : 'text-slate-600'}`}>Канбан</button>
              <button onClick={() => setActiveTab('table')} className={`px-3 py-1.5 rounded-lg ${activeTab === 'table' ? 'bg-white shadow-xs' : 'text-slate-600'}`}>Контакты</button>
            </div>
            <input 
              type="text" 
              value={search} 
              onChange={e => setSearch(e.target.value)} 
              placeholder="Поиск бренда..." 
              className="px-3 py-1.5 bg-white border border-slate-200 rounded-xl text-xs w-64"
            />
          </div>

          {/* Канбан */}
          {activeTab === 'kanban' ? (
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-3 items-start flex-1">
              {STAGES.map(stage => {
                const list = filtered.filter(b => b.stage === stage.id);
                return (
                  <div key={stage.id} className="bg-slate-100 p-3 rounded-2xl border border-slate-200 flex flex-col gap-2">
                    <div className="flex items-center justify-between font-bold text-xs text-slate-700">
                      <span>{stage.short}</span>
                      <span className="bg-white px-2 py-0.5 rounded-full text-[10px]">{list.length}</span>
                    </div>
                    <div className="space-y-2">
                      {list.map(brand => (
                        <div key={brand.id} className="bg-white p-3 rounded-xl border border-slate-200 shadow-xs flex flex-col gap-2">
                          <div className="flex justify-between items-start">
                            <div>
                              <div className="font-bold text-sm text-slate-900">{brand.name}</div>
                              <div className="text-[11px] text-slate-500">{brand.railFormat} • {brand.monthlyFee.toLocaleString('ru-RU')} ₽</div>
                            </div>
                            <button onClick={() => { setEditingBrand(brand); setIsModalOpen(true); }} className="text-xs text-slate-400 hover:text-slate-700">✎</button>
                          </div>
                          
                          <div className="flex flex-wrap gap-1 text-[11px]">
                            {brand.tgUsername && (
                              <a href={`https://t.me/${brand.tgUsername}`} target="_blank" className="px-2 py-0.5 bg-sky-50 text-sky-700 rounded-md font-medium">
                                @{brand.tgUsername}
                              </a>
                            )}
                            {brand.phone && (
                              <a href={`tel:${brand.phone}`} className="px-2 py-0.5 bg-emerald-50 text-emerald-700 rounded-md font-medium">
                                {brand.phone}
                              </a>
                            )}
                          </div>

                          <div className="flex items-center gap-1.5 pt-1 border-t border-slate-100">
                            <button 
                              onClick={() => {
                                const msg = `Привет, команда ${brand.name}! Предлагаем разместить вашу коллекцию на рейле в нашем шоуруме. Подскажите, с кем обсудить детали?`;
                                navigator.clipboard.writeText(msg);
                                if (brand.tgUsername) window.open(`https://t.me/${brand.tgUsername}`, '_blank');
                                alert('Оффер скопирован! Открываем Telegram...');
                              }}
                              className="flex-1 py-1 bg-slate-900 text-white rounded-lg text-[10px] font-semibold"
                            >
                              Оффер + ТГ
                            </button>
                            <select 
                              value={brand.stage} 
                              onChange={e => setBrands(brands.map(b => b.id === brand.id ? { ...b, stage: e.target.value } : b))}
                              className="text-[10px] bg-slate-100 border border-slate-200 rounded-lg px-1.5 py-1"
                            >
                              {STAGES.map(s => <option key={s.id} value={s.id}>{s.short}</option>)}
                            </select>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          ) : (
            /* Таблица */
            <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-xs">
              <table className="w-full text-left text-xs">
                <thead className="bg-slate-50 border-b border-slate-200 text-slate-500 font-bold uppercase text-[10px]">
                  <tr>
                    <th className="p-3">Бренд</th>
                    <th className="p-3">Этап</th>
                    <th className="p-3">Telegram</th>
                    <th className="p-3">Телефон</th>
                    <th className="p-3">Аренда</th>
                    <th className="p-3 text-right">Действия</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {filtered.map(b => (
                    <tr key={b.id} className="hover:bg-slate-50">
                      <td className="p-3 font-bold">{b.name}</td>
                      <td className="p-3">
                        <select 
                          value={b.stage} 
                          onChange={e => setBrands(brands.map(item => item.id === b.id ? { ...item, stage: e.target.value } : item))}
                          className="bg-slate-100 border border-slate-200 rounded-md p-1 text-[11px]"
                        >
                          {STAGES.map(s => <option key={s.id} value={s.id}>{s.title}</option>)}
                        </select>
                      </td>
                      <td className="p-3">
                        {b.tgUsername ? <a href={`https://t.me/${b.tgUsername}`} target="_blank" className="text-sky-600 font-medium">@{b.tgUsername}</a> : '—'}
                      </td>
                      <td className="p-3">{b.phone || '—'}</td>
                      <td className="p-3 font-semibold">{b.monthlyFee.toLocaleString('ru-RU')} ₽</td>
                      <td className="p-3 text-right">
                        <button onClick={() => { setEditingBrand(b); setIsModalOpen(true); }} className="text-slate-500 hover:text-slate-800 mr-2">Ред.</button>
                        <button onClick={() => setBrands(brands.filter(item => item.id !== b.id))} className="text-rose-500">Удалить</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          {/* Модалка */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50">
              <form onSubmit={handleSave} className="bg-white p-6 rounded-2xl w-full max-w-md space-y-3 text-xs">
                <h3 className="text-base font-bold text-slate-900">{editingBrand ? 'Редактировать бренд' : 'Новый бренд'}</h3>
                <div>
                  <label className="block font-semibold mb-1">Название бренда *</label>
                  <input name="name" defaultValue={editingBrand?.name || ''} required className="w-full border rounded-lg p-2" />
                </div>
                <div>
                  <label className="block font-semibold mb-1">Telegram @username</label>
                  <input name="tgUsername" defaultValue={editingBrand?.tgUsername || ''} placeholder="username" className="w-full border rounded-lg p-2" />
                </div>
                <div>
                  <label className="block font-semibold mb-1">Телефон</label>
                  <input name="phone" defaultValue={editingBrand?.phone || ''} placeholder="+7..." className="w-full border rounded-lg p-2" />
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block font-semibold mb-1">Аренда (₽/мес)</label>
                    <input name="monthlyFee" type="number" defaultValue={editingBrand?.monthlyFee ?? 30000} className="w-full border rounded-lg p-2" />
                  </div>
                  <div>
                    <label className="block font-semibold mb-1">Этап</label>
                    <select name="stage" defaultValue={editingBrand?.stage || 'lead'} className="w-full border rounded-lg p-2 bg-white">
                      {STAGES.map(s => <option key={s.id} value={s.id}>{s.title}</option>)}
                    </select>
                  </div>
                </div>
                <div>
                  <label className="block font-semibold mb-1">Заметки</label>
                  <textarea name="notes" defaultValue={editingBrand?.notes || ''} rows="2" className="w-full border rounded-lg p-2"></textarea>
                </div>
                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 border rounded-lg">Отмена</button>
                  <button type="submit" className="px-4 py-2 bg-slate-900 text-white rounded-lg font-semibold">Сохранить</button>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
