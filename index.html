    const DEFAULT_OFFER_TEMPLATE = `Привет, команда {brand}! 👋\n\nПишу вам по поводу партнерства и выставления вашей коллекции в нашем мультибрендовом шоуруме.\n\nНам очень близок ваш стиль! Мы предлагаем:\n• Выделенный рейл или корнер с вашим брендингом\n• Полное кассовое и клиентское обслуживание + работа стилистов\n• Контент-поддержка и отметки в наших соцсетях\n• Прозрачная отчетность по продажам\n\nПодскажите, с кем можно обсудить условия размещения? Либо напишите нашему боту: https://t.me/SM_Brand_CRM_bot`;

    // --- ПАРСЕР КОМАНД И ЕСТЕСТВЕННОЙ РЕЧИ ---
    function parseSmartInput(rawText, existingBrands) {
      const text = rawText.trim();
      const lower = text.toLowerCase();

      if (lower === '/start' || lower === '/help' || lower === 'помощь' || lower === 'команды') {
        return { type: 'HELP' };
      }
      if (lower === '/stats' || lower === '/summary' || lower.includes('статистик') || lower.includes('сводк') || lower.includes('выручк')) {
        return { type: 'STATS' };
      }
      if (lower === '/list' || lower === 'список' || lower === 'все бренды' || lower.includes('покажи бренды')) {
        return { type: 'LIST_ALL' };
      }

      const detectStage = (str) => {
        const s = str.toLowerCase();
        if (s.includes('выставлен') || s.includes('в шоурум') || s.includes('актив') || s.includes('заехал')) return 'active';
        if (s.includes('договор') || s.includes('подпис') || s.includes('контракт')) return 'contract';
        if (s.includes('ответил') || s.includes('переговор') || s.includes('думают') || s.includes('обсуждаем')) return 'replied';
        if (s.includes('написал') || s.includes('оффер') || s.includes('отправил')) return 'contacted';
        if (s.includes('отказ') || s.includes('отлож') || s.includes('не интерес')) return 'rejected';
        if (s.includes('база') || s.includes('планир') || s.includes('лид')) return 'lead';
        return null;
      };

      if (lower.startsWith('/add ') || lower.startsWith('добавь бренд') || lower.startsWith('добавить бренд') || lower.startsWith('новый бренд') || lower.startsWith('создай бренд')) {
        const cleanBody = text.replace(/^(\/add|добавь бренд|добавить бренд|новый бренд|создай бренд)\s*/i, '').trim();
        const phoneMatch = cleanBody.match(/(\+?[78][\s\-()]*\d{3}[\s\-()]*\d{3}[\s\-()]*\d{2}[\s\-()]*\d{2})/);
        const phone = phoneMatch ? phoneMatch[1].replace(/[^\d+]/g, '') : '';
        const tgMatch = cleanBody.match(/@([a-zA-Z0-9_]{3,})/);
        const tgUsername = tgMatch ? tgMatch[1] : '';
        const feeMatch = cleanBody.match(/(\d{2,3})\s*(тыс|к|k|000|\s*₽|\s*руб)/i);
        let monthlyFee = 30000;
        if (feeMatch) {
          const num = parseInt(feeMatch[1], 10);
          monthlyFee = num < 1000 ? num * 1000 : num;
        }
        let namePart = cleanBody.split(/[,\n|]/)[0].replace(/@[a-zA-Z0-9_]+/g, '').replace(/(\+?[78][\s\-()]*\d{3}[\s\-()]*\d{3}[\s\-()]*\d{2}[\s\-()]*\d{2})/g, '').trim();
        if (!namePart) namePart = 'Новый Бренд';

        return {
          type: 'ADD_BRAND',
          payload: {
            name: namePart.toUpperCase(),
            tgUsername,
            phone,
            monthlyFee,
            stage: detectStage(cleanBody) || 'lead',
            notes: `Добавлено через бот/голос: «${cleanBody}»`
          }
        };
      }

      if (lower.startsWith('/status ') || lower.startsWith('статус ') || lower.startsWith('переведи ') || lower.startsWith('этап ')) {
        const matchedBrand = existingBrands.find(b => lower.includes(b.name.toLowerCase()) || (b.tgUsername && lower.includes(b.tgUsername.toLowerCase())));
        const targetStage = detectStage(lower);
        if (matchedBrand && targetStage) {
          return { type: 'UPDATE_STAGE', brand: matchedBrand, stage: targetStage };
        }
      }

      if (lower.startsWith('/note ') || lower.startsWith('заметка ') || lower.startsWith('комментарий ')) {
        const matchedBrand = existingBrands.find(b => lower.includes(b.name.toLowerCase()) || (b.tgUsername && lower.includes(b.tgUsername.toLowerCase())));
        if (matchedBrand) {
          const noteText = text.replace(/^(\/note|заметка|комментарий)\s*/i, '').replace(new RegExp(matchedBrand.name, 'i'), '').replace(/^[:\-—\s]+/, '').trim();
          return { type: 'ADD_NOTE', brand: matchedBrand, note: noteText || text };
        }
      }

      if (lower.startsWith('/find ') || lower.startsWith('/info ') || lower.startsWith('инфо ') || lower.startsWith('что по ') || lower.startsWith('найди ')) {
        const query = text.replace(/^(\/find|\/info|инфо по|инфо|что по|найди)\s*/i, '').trim().toLowerCase();
        const matchedBrand = existingBrands.find(b => b.name.toLowerCase().includes(query) || (b.tgUsername && b.tgUsername.toLowerCase().includes(query)));
        return { type: 'FIND_BRAND', query, brand: matchedBrand || null };
      }

      // Естественная речь по существующему бренду
      const directMatch = existingBrands.find(b => lower.includes(b.name.toLowerCase().split(' ')[0]));
      if (directMatch) {
        const newStage = detectStage(lower);
        if (newStage) {
          return { type: 'UPDATE_STAGE', brand: directMatch, stage: newStage };
        }
        return { type: 'FIND_BRAND', query: directMatch.name, brand: directMatch };
      }

      return { type: 'UNKNOWN', rawText: text };
    }

    function App() {
      const [brands, setBrands] = useState(() => {
        const saved = localStorage.getItem('sm_crm_brands_v3');
        return saved ? JSON.parse(saved) : INITIAL_BRANDS;
      });

      const [botToken, setBotToken] = useState(() => localStorage.getItem('sm_crm_token') || '8312776596:AAE0LlYuKisLzebdftj2fJaQ5571RSu5CBI');
      const [botInfo, setBotInfo] = useState(null);
      const [botStatus, setBotStatus] = useState('checking');
      const [activeTab, setActiveTab] = useState('kanban'); // 'kanban' | 'list' | 'assistant' | 'telegram' | 'guide'
      const [searchQuery, setSearchQuery] = useState('');
      const [stageFilter, setStageFilter] = useState('all');
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingBrand, setEditingBrand] = useState(null);
      const [toast, setToast] = useState(null);
      const [webAppUrl, setWebAppUrl] = useState(() => localStorage.getItem('sm_crm_webapp_url') || window.location.href);

      // Ассистент
      const [commandInput, setCommandInput] = useState('');
      const [isListening, setIsListening] = useState(false);
      const [assistantLogs, setAssistantLogs] = useState(() => {
        const saved = localStorage.getItem('sm_crm_logs');
        return saved ? JSON.parse(saved) : [{
          id: 'welcome',
          sender: 'bot',
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          text: '👋 Привет! Я ассистент шоурума (@SM_Brand_CRM_bot). Напишите или надиктуйте команду:\n• «Добавь бренд Outlaw @outlaw 35к»\n• «Переведи Волчок в договор»\n• «Что по бренду Krakatau?»\n• «/stats»'
        }];
      });

      // Telegram обновления
      const [tgUpdates, setTgUpdates] = useState(() => JSON.parse(localStorage.getItem('sm_crm_updates') || '[]'));
      const [isSyncing, setIsSyncing] = useState(false);
      const lastUpdateIdRef = useRef(Number(localStorage.getItem('sm_crm_last_uid') || 0));
      const brandsRef = useRef(brands);
      useEffect(() => { brandsRef.current = brands; }, [brands]);

      useEffect(() => { localStorage.setItem('sm_crm_brands_v3', JSON.stringify(brands)); }, [brands]);
      useEffect(() => { localStorage.setItem('sm_crm_token', botToken); }, [botToken]);
      useEffect(() => { localStorage.setItem('sm_crm_logs', JSON.stringify(assistantLogs.slice(0, 30))); }, [assistantLogs]);
      useEffect(() => { localStorage.setItem('sm_crm_updates', JSON.stringify(tgUpdates)); }, [tgUpdates]);
      useEffect(() => { localStorage.setItem('sm_crm_webapp_url', webAppUrl); }, [webAppUrl]);

      // Telegram WebApp expand
      useEffect(() => {
        if (window.Telegram && window.Telegram.WebApp) {
          window.Telegram.WebApp.ready();
          window.Telegram.WebApp.expand();
        }
      }, []);

      const showToast = (message) => {
        setToast(message);
        setTimeout(() => setToast(null), 3500);
      };

      // Проверка бота
      const checkBot = async (token) => {
        if (!token) return;
        setBotStatus('checking');
        try {
          const res = await fetch(`https://api.telegram.org/bot${token}/getMe`);
          const data = await res.json();
          if (data.ok) {
            setBotInfo(data.result);
            setBotStatus('connected');
          } else {
            setBotStatus('error');
          }
        } catch (e) {
          setBotStatus('error');
        }
      };

      useEffect(() => { checkBot(botToken); }, []);

      // Синхронизация сообщений из Telegram
      const fetchBotUpdates = async (silent = false) => {
        if (!botToken) return;
        if (!silent) setIsSyncing(true);
        try {
          const offset = lastUpdateIdRef.current ? lastUpdateIdRef.current + 1 : 0;
          const res = await fetch(`https://api.telegram.org/bot${botToken}/getUpdates?offset=${offset}&timeout=1`);
          const data = await res.json();
          if (data.ok && Array.isArray(data.result) && data.result.length > 0) {
            const newMsgs = [];
            for (const item of data.result) {
              if (item.update_id > lastUpdateIdRef.current) {
                lastUpdateIdRef.current = item.update_id;
                localStorage.setItem('sm_crm_last_uid', String(item.update_id));
              }
              const msg = item.message;
              if (msg) {
                const text = msg.text || (msg.voice ? '🎤 [Голосовое сообщение]' : '[Файл]');
                newMsgs.push({
                  updateId: item.update_id,
                  chatId: msg.chat.id,
                  username: msg.from?.username || '',
                  name: (msg.from?.first_name || '') + ' ' + (msg.from?.last_name || ''),
                  text,
                  date: new Date(msg.date * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                });

                // Если это команда из чата
                if (msg.text && (msg.text.startsWith('/') || /^(добавь|переведи|статус|заметка|найди|сводка)/i.test(msg.text))) {
                  executeSmartCommand(msg.text, 'telegram', msg.chat.id);
                }
              }
            }
            if (newMsgs.length > 0) {
              setTgUpdates(prev => [...newMsgs.reverse(), ...prev]);
              showToast(`Получено сообщений из бота: ${newMsgs.length}`);
            }
          } else if (!silent) {
            showToast('Новых сообщений в боте нет');
          }
        } catch (e) {
          if (!silent) showToast('Ошибка синхронизации с Telegram');
        } finally {
          if (!silent) setIsSyncing(false);
        }
      };

      // Периодический опрос бота
      useEffect(() => {
        const interval = setInterval(() => { fetchBotUpdates(true); }, 7000);
        return () => clearInterval(interval);
      }, [botToken]);

      // Выполнение умных команд
      const executeSmartCommand = async (rawText, source = 'local', chatId = null) => {
        if (!rawText.trim()) return;
        const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const userLog = { id: 'u-' + Date.now(), sender: 'user', time: now, text: rawText, source };
        const action = parseSmartInput(rawText, brandsRef.current);
        let resp = '';

        if (action.type === 'HELP') {
          resp = `📋 Доступные команды:\n• /add ИМЯ @user +7... 35к — добавить бренд\n• /status ИМЯ договор — изменить этап сделки\n• /note ИМЯ текст — сохранить заметку\n• /find ИМЯ — найти контакты бренда\n• /stats — выручка и сводка\n• /list — список брендов`;
        } else if (action.type === 'STATS') {
          const act = brandsRef.current.filter(b => b.stage === 'active');
          const con = brandsRef.current.filter(b => b.stage === 'contract');
          const rev = act.reduce((s, b) => s + (b.monthlyFee || 0), 0);
          const pot = con.reduce((s, b) => s + (b.monthlyFee || 0), 0);
          resp = `📊 Сводка шоурума:\n• Всего брендов: ${brandsRef.current.length}\n• Выставлены в зале: ${act.length} (${rev.toLocaleString('ru-RU')} ₽/мес)\n• На договоре: ${con.length} (+${pot.toLocaleString('ru-RU')} ₽/мес)`;
        } else if (action.type === 'LIST_ALL') {
          resp = `🗂 Список брендов:\n` + brandsRef.current.map(b => `• ${b.name} (${STAGES.find(s=>s.id===b.stage)?.short}) — ${(b.monthlyFee||0).toLocaleString('ru-RU')} ₽`).join('\n');
        } else if (action.type === 'ADD_BRAND') {
          const newB = {
            id: 'b-' + Date.now(),
            name: action.payload.name,
            category: 'Streetwear / Одежда',
            contactName: '',
            tgUsername: action.payload.tgUsername,
            phone: action.payload.phone,
            stage: action.payload.stage,
            railFormat: '1 рейл',
            monthlyFee: action.payload.monthlyFee,
            commission: '25%',
            lastContact: new Date().toISOString().split('T')[0],
            notes: action.payload.notes
          };
          setBrands(prev => [newB, ...prev]);
          resp = `✅ Бренд «${newB.name}» успешно добавлен в базу!\n• Этап: ${STAGES.find(s=>s.id===newB.stage)?.title}\n• Аренда: ${newB.monthlyFee.toLocaleString('ru-RU')} ₽/мес`;
          showToast(`Добавлен: ${newB.name}`);
        } else if (action.type === 'UPDATE_STAGE') {
          setBrands(prev => prev.map(b => b.id === action.brand.id ? { ...b, stage: action.stage } : b));
          resp = `🔄 Статус бренда «${action.brand.name}» изменен на: «${STAGES.find(s=>s.id===action.stage)?.title}»`;
          showToast(`${action.brand.name} → ${STAGES.find(s=>s.id===action.stage)?.short}`);
        } else if (action.type === 'ADD_NOTE') {
          setBrands(prev => prev.map(b => b.id === action.brand.id ? { ...b, notes: (b.notes ? b.notes + '\n' : '') + `[${now}]: ${action.note}` } : b));
          resp = `📝 Заметка для «${action.brand.name}» добавлена:\n«${action.note}»`;
          showToast(`Заметка сохранена`);
        } else if (action.type === 'FIND_BRAND') {
          if (action.brand) {
            const b = action.brand;
            resp = `🔎 Бренд «${b.name}»:\n• Этап: ${STAGES.find(s=>s.id===b.stage)?.title}\n• Telegram: ${b.tgUsername ? '@' + b.tgUsername : '—'}\n• Телефон: ${b.phone || '—'}\n• Аренда: ${(b.monthlyFee||0).toLocaleString('ru-RU')} ₽ (${b.railFormat})\n• Заметка: ${b.notes || '—'}`;
          } else {
            resp = `❓ Бренд по запросу «${action.query}» не найден. Для создания напишите:\n/add ${action.query.toUpperCase()} @username +7999... 30к`;
          }
        } else {
          resp = `🤖 Команда принята. Чтобы изменить базу, напишите:\n• «Добавь бренд Name @user +7... 35к»\n• «Переведи [Бренд] в договор»\n• «Что по бренду [Бренд]?»`;
        }

        const botLog = { id: 'b-' + Date.now(), sender: 'bot', time: now, text: resp };
        setAssistantLogs(prev => [botLog, userLog, ...prev]);

        // Отправка ответа в Телеграм, если команда пришла оттуда
        if (source === 'telegram' && chatId && botToken) {
          fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: chatId, text: resp })
          }).catch(console.error);
        }
      };

      // Голосовой ввод
      const toggleVoice = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) return alert('Голосовой ввод не поддерживается данным браузером. Отправляйте голосовые прямо в бота в Telegram!');
        if (isListening) return;

        const rec = new SpeechRecognition();
        rec.lang = 'ru-RU';
        rec.onstart = () => setIsListening(true);
        rec.onresult = (e) => {
          const txt = e.results[0][0].transcript;
          setCommandInput(txt);
          executeSmartCommand(txt, 'voice');
        };

            { command: 'note', description: 'Заметка: /note Имя текст' },
            { command: 'find', description: 'Найти контакты: /find Имя' },
            { command: 'stats', description: 'Сводка выручки и воронки' },
            { command: 'list', description: 'Список всех брендов' }
          ];

          await fetch(`https://api.telegram.org/bot${botToken}/setMyCommands`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ commands })

        const data = {
          id: editingBrand?.id || 'b-' + Date.now(),
          name: fd.get('name').trim(),
          category: fd.get('category').trim() || 'Одежда',
          contactName: fd.get('contactName').trim(),
          tgUsername: fd.get('tgUsername').trim().replace('@', ''),
          phone: fd.get('phone').trim(),
          stage: fd.get('stage'),
          railFormat: fd.get('railFormat').trim() || '1 рейл',
          monthlyFee: Number(fd.get('monthlyFee')) || 0,
          commission: fd.get('commission').trim() || '25%',
          lastContact: new Date().toISOString().split('T')[0],
          notes: fd.get('notes').trim()

        if (editingBrand) {
          setBrands(brands.map(b => b.id === data.id ? data : b));
          showToast(`Бренд ${data.name} обновлен`);

                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block font-semibold mb-1">Telegram @username</label>
                    <input name="tgUsername" defaultValue={editingBrand?.tgUsername || ''} placeholder="username" className="w-full border rounded-lg p-2" />
                  </div>
                  <div>
                    <label className="block font-semibold mb-1">Телефон</label>
                    <input name="phone" defaultValue={editingBrand?.phone || ''} placeholder="+7..." className="w-full border rounded-lg p-2" />
                  </div>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block font-semibold mb-1">Аренда (₽/мес)</label>
                    <input name="monthlyFee" type="number" defaultValue={editingBrand?.monthlyFee ?? 30000} className="w-full border rounded-lg p-2" />
                  </div>
                  <div>
                    <label className="block font-semibold mb-1">Этап воронки</label>
                    <select name="stage" defaultValue={editingBrand?.stage || 'lead'} className="w-full border rounded-lg p-2 bg-white">
                      {STAGES.map(s => <option key={s.id} value={s.id}>{s.title}</option>)}
                    </select>
                  </div>
                </div>
                <div>
                  <label className="block font-semibold mb-1">Формат рейлов</label>
                  <input name="railFormat" defaultValue={editingBrand?.railFormat || '1 рейл'} className="w-full border rounded-lg p-2" />
                </div>
                <div>
                  <label className="block font-semibold mb-1">Заметки и история переговоров</label>
                  <textarea name="notes" defaultValue={editingBrand?.notes || ''} rows="3" className="w-full border rounded-lg p-2"></textarea>
                </div>
                <div className="flex justify-end gap-2 pt-2">
                  <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 border rounded-lg">Отмена</button>
                  <button type="submit" className="px-5 py-2 bg-slate-900 text-white rounded-lg font-semibold">Сохранить</button>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
