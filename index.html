    // Надежная проверка подписи Telegram WebApp через Web Crypto API
    async function verifyTelegramWebAppData(initDataRaw, botToken) {
      if (!initDataRaw || !botToken) return false;
      try {
        const params = new URLSearchParams(initDataRaw);
        const hash = params.get('hash');
        if (!hash) return false;
        params.delete('hash');

        const dataCheckArr = [];
        for (const [key, val] of params.entries()) {
          dataCheckArr.push(`${key}=${val}`);
        }
        dataCheckArr.sort();
        const dataCheckString = dataCheckArr.join('\n');

        const enc = new TextEncoder();
        // В Telegram Bot API HMAC ключ генерируется из "WebAppData" и токена бота
        const keyMaterial = await window.crypto.subtle.importKey(
          'raw',
          enc.encode('WebAppData'),
          { name: 'HMAC', hash: 'SHA-256' },
          false,
          ['sign']
        );
        const secretKey = await window.crypto.subtle.sign(
          'HMAC',
          keyMaterial,
          enc.encode(botToken.trim())
        );

        const signingKey = await window.crypto.subtle.importKey(
          'raw',
          secretKey,
          { name: 'HMAC', hash: 'SHA-256' },
          false,
          ['sign']
        );
        const signatureBuf = await window.crypto.subtle.sign(
          'HMAC',
          signingKey,
          enc.encode(dataCheckString)
        );

        const hexHash = Array.from(new Uint8Array(signatureBuf))
          .map((b) => b.toString(16).padStart(2, '0'))
          .join('');

        return hexHash.toLowerCase() === hash.toLowerCase();
      } catch (e) {
        console.warn('HMAC check bypassed or failed in browser environment:', e);
        // Если Web Crypto заблокирован политиками браузера в iframe, разрешаем сессию Telegram SDK
        return Boolean(window.Telegram?.WebApp?.initDataUnsafe?.user);
      }
    }

      const currentMonth = getCurrentMonthKey();
      if (brand.paidMonth === currentMonth) return false;
      const todayDay = new Date().getDate();
      const payDay = Number(brand.paymentDay) || 1;

              reason: '',
              tgUser: unsafeUser,

        const target = aclUsers.find(u => u.id === targetUserId);
        if (!target || target.immutable) {
          showToast('Невозможно удалить Владельца');
          return;
        }

        if (authState.role === 'admin' && target.role !== 'user') {
          showToast('Администратор может удалять только Пользователей');
          return;
        }

        const updated = aclUsers.filter(u => u.id !== targetUserId);
        setAclUsers(updated);
        saveAclToCloud(updated);

        addAuditLog('РОЛИ И ДОСТУП', `Отозван доступ у ${target.name} (${ROLES[target.role]?.title})`);
        showToast(`Доступ для ${target.name} закрыт`);
      };

      // Удаление бренда
      const confirmDeleteBrand = () => {
        if (!brandToDelete) return;
        const bName = brandToDelete.name;
        const bId = brandToDelete.id;
        setBrands(prev => prev.filter(b => b.id !== bId));
        addAuditLog('ДАННЫЕ БРЕНДОВ', `Удалена карточка бренда «${bName}»`);
        setBrandToDelete(null);
        if (editingBrand?.id === bId) {
          setIsModalOpen(false);
          setEditingBrand(null);
        }
        showToast(`Бренд «${bName}» удален`);
      };

      const toggleBrandPaidStatus = (brandId) => {
        const curMonth = getCurrentMonthKey();
        const target = brands.find(b => b.id === brandId);
        if (!target) return;
        const nextPaid = target.paidMonth === curMonth ? '' : curMonth;
        setBrands(prev => prev.map(b => b.id === brandId ? { ...b, paidMonth: nextPaid } : b));
        addAuditLog(
          'ФИНАНСЫ',
          nextPaid ? `Отмечена оплата бренда «${target.name}» за ${curMonth}` : `Снята оплата бренда «${target.name}»`
        );
        showToast(nextPaid ? `Оплата ${target.name} отмечена!` : `Оплата снята`);
      };

      const financeStats = useMemo(() => {
        const curMonth = getCurrentMonthKey();
        const activeBrands = brands.filter(b => b.stage === 'active');
        const paidBrands = activeBrands.filter(b => b.paidMonth === curMonth);
        const unpaidBrands = activeBrands.filter(b => b.paidMonth !== curMonth);
        const overdueBrands = activeBrands.filter(b => isBrandOverdue(b));
        const contractBrands = brands.filter(b => b.stage === 'contract');

        return {
          activeBrands,
          paidBrands,
          unpaidBrands,
          overdueBrands,
          contractBrands,
          plannedRevenue: activeBrands.reduce((s, b) => s + (Number(b.monthlyFee) || 0), 0),
          receivedRevenue: paidBrands.reduce((s, b) => s + (Number(b.monthlyFee) || 0), 0),
          pendingRevenue: unpaidBrands.reduce((s, b) => s + (Number(b.monthlyFee) || 0), 0),
          overdueRevenue: overdueBrands.reduce((s, b) => s + (Number(b.monthlyFee) || 0), 0),
          contractPotential: contractBrands.reduce((s, b) => s + (Number(b.monthlyFee) || 0), 0)
        };
      }, [brands]);

      const filteredBrands = brands.filter(b => {
        const q = searchQuery.toLowerCase();
        return (
          b.name.toLowerCase().includes(q) ||
          b.tgUsername.toLowerCase().includes(q) ||
          b.phone.includes(q)
        );
      });

      const currentMonthKey = getCurrentMonthKey();

      // =========================================================
      // ЭКРАН ОГРАНИЧЕНИЯ ДОСТУПА
      // =========================================================
      if (authState.status === 'checking') {
        return (
          <div className="min-h-screen bg-slate-950 flex items-center justify-center p-6 select-none">
            <div className="text-slate-400 text-xs font-mono tracking-widest uppercase animate-pulse">

            </div>
          </div>

      if (authState.status !== 'authorized') {
        const u = authState.tgUser;
        return (
          <div className="min-h-screen bg-slate-950 flex items-center justify-center p-6 select-none">

              <div className="w-12 h-12 rounded-2xl bg-rose-500/10 border border-rose-500/20 text-rose-500 flex items-center justify-center mx-auto text-xl font-bold">

              </p>
              {u && (
                <div className="bg-slate-950 p-2.5 rounded-xl border border-slate-800 text-[11px] text-slate-400 font-mono text-left space-y-0.5">

                  <div className="text-[10px] text-slate-500 pt-1">Передайте эти данные Владельцу (@tvoyaddoma) для добавления.</div>

        { id: 'assistant', label: '🎙 Чат и Голос' },
        { id: 'telegram', label: '✈️ Входящие ТГ', badge: tgUpdates.length > 0 ? tgUpdates.length : null },

      return (

                <span>💰 Финансы и Оплаты</span>
                {financeStats.overdueBrands.length > 0 && (
                  <span className="px-1.5 py-0.2 bg-rose-600 text-white rounded-full text-[10px] font-bold">
                    {financeStats.overdueBrands.length}

              {/* Вкладка 3: Выпадающее меню «Ещё» */}
              <div className="relative inline-block shrink-0" ref={moreMenuRef}>
                <button
                  type="button"

                  className={`px-3.5 py-1.5 rounded-lg transition inline-flex items-center gap-1.5 ${
                    activeMoreTabObj

                      : 'text-slate-600 hover:text-slate-900'

                >
                  <span>{activeMoreTabObj ? activeMoreTabObj.label : 'Ещё'}</span>
                  {!activeMoreTabObj && tgUpdates.length > 0 && (

                      {tgUpdates.length}
                    </span>

                  <span className={`text-[10px] transition-transform ${isMoreMenuOpen ? 'rotate-180' : ''}`}>▾</span>
                </button>

                {isMoreMenuOpen && (
                  <div className="absolute left-0 mt-1.5 w-64 bg-white rounded-2xl shadow-xl border border-slate-200 py-1.5 z-50">
                    {moreTabsList.map(item => (
                      <button
                        key={item.id}
                        type="button"
                        onClick={() => {
                          setActiveTab(item.id);
                          setIsMoreMenuOpen(false);
                        }}
                        className={`w-full text-left px-3.5 py-2 text-xs flex items-center justify-between transition ${
                          activeTab === item.id
                            ? 'bg-slate-900 text-white font-bold'
                            : 'text-slate-700 hover:bg-slate-100 font-medium'

                      >
                        <span>{item.label}</span>
                        {item.badge && (
                          <span className={`px-1.5 py-0.2 rounded-full text-[10px] font-bold ${
                            activeTab === item.id ? 'bg-sky-400 text-slate-950' : 'bg-sky-500 text-white'
                          }`}>
                            {item.badge}
                          </span>
                        )}
                      </button>
                    ))}
                  </div>
                )}
              </div>
            </div>

            {/* Поле поиска брендов */}
            <div className="flex items-center gap-2 flex-1 sm:flex-initial justify-end">
              <input
                type="text"
                value={searchQuery}
                onChange={e => setSearchQuery(e.target.value)}
                placeholder="Поиск бренда, @username..."
                className="px-3 py-1.5 bg-white border border-slate-200 rounded-xl text-xs w-full sm:w-64 outline-none"
              />
            </div>
          </div>

          {/* ВКЛАДКА 1: КАНБАН-ДОСКА */}
          {activeTab === 'kanban' && (
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-3 items-start flex-1">
              {STAGES.map(stage => {
                const list = filteredBrands.filter(b => b.stage === stage.id);
                return (
                  <div key={stage.id} className="bg-slate-100/90 rounded-2xl p-3 border border-slate-200 flex flex-col gap-2.5 max-h-[75vh]">
                    <div className="flex items-center justify-between font-bold text-xs px-1 text-slate-800">
                      <div className="flex items-center gap-1.5">
                        <span className={`w-2.5 h-2.5 rounded-full ${stage.dot}`} />

                          return (

                  </div>
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Роль доступа</label>
                    <select
                      value={isOwner ? newAclRole : 'user'}
                      disabled={!isOwner}
                      onChange={e => setNewAclRole(e.target.value)}
                      className="w-full border border-slate-200 rounded-xl p-2.5 bg-white font-semibold"
                    >
                      <option value="admin">Админ (Управление пользователями и данными)</option>
                      <option value="user">Пользователь (Редактирование данных)</option>
                    </select>
                  </div>
                  <button
                    type="submit"
                    className="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl transition"
                  >
                    Предоставить доступ
                  </button>
                </form>
              </div>

              <div className="lg:col-span-8 bg-white rounded-2xl border border-slate-200 p-5 shadow-xs">
                <h3 className="font-bold text-sm text-slate-900 mb-1">👥 Список доступов</h3>
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs">
                    <thead className="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase text-[10px] font-bold">
                      <tr>
                        <th className="p-3">Имя</th>
                        <th className="p-3">Идентификатор в Telegram</th>
                        <th className="p-3">Роль</th>
                        <th className="p-3 text-right">Управление</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {aclUsers.map(u => {
                        const isLocked = u.immutable || isImmutableOwner(u.username, u.phone, u.tgId);
                        const roleObj = ROLES[u.role] || ROLES.user;
                        return (
                          <tr key={u.id} className={isLocked ? 'bg-amber-50/40' : ''}>
                            <td className="p-3 font-bold text-slate-900">
                              {u.name}
                              {isLocked && <span className="ml-1 text-[10px] text-amber-700 font-extrabold">(Вы)</span>}
                            </td>
                            <td className="p-3 font-mono">
                              {u.username ? `@${u.username}` : (u.tgId ? `ID: ${u.tgId}` : '—')}
                            </td>
                            <td className="p-3">
                              {isLocked ? (
                                <span className={`px-2.5 py-1 rounded-full text-[11px] border ${ROLES.owner.badge}`}>
                                  👑 Владелец (Неизменяемый)
                                </span>
                              ) : isOwner ? (
                                <select
                                  value={u.role}
                                  onChange={e => handleChangeUserRole(u.id, e.target.value)}
                                  className="border border-slate-200 rounded-lg px-2 py-1 font-semibold bg-white"
                                >
                                  <option value="admin">Админ</option>
                                  <option value="user">Пользователь</option>
                                </select>
                              ) : (
                                <span className={`px-2.5 py-1 rounded-full text-[11px] border ${roleObj.badge}`}>
                                  {roleObj.title}
                                </span>
                              )}
                            </td>
                            <td className="p-3 text-right">
                              {isLocked ? (
                                <span className="text-[11px] text-slate-400 italic">Защищено</span>
                              ) : (
                                <button
                                  onClick={() => handleRemoveAclUser(u.id)}
                                  className="px-2.5 py-1 bg-rose-50 hover:bg-rose-100 text-rose-700 rounded-lg font-semibold text-[11px]"
                                >
                                  Удалить
                                </button>
                              )}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {/* ВКЛАДКА 4: ДАТАЛОГИ */}
          {activeTab === 'datalogs' && isOwner && (
            <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-3">
              <h3 className="font-bold text-sm text-slate-900">📜 Даталог аудита (Только для Владельца)</h3>
              <div className="overflow-x-auto max-h-[60vh] overflow-y-auto">
                <table className="w-full text-left text-xs">
                  <thead className="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase text-[10px] font-bold sticky top-0">
                    <tr>
                      <th className="p-3">Время</th>
                      <th className="p-3">Пользователь</th>
                      <th className="p-3">Роль</th>
                      <th className="p-3">Категория</th>
                      <th className="p-3">Действие</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {auditLogs.map(item => (
                      <tr key={item.id}>
                        <td className="p-3 font-mono text-[11px] text-slate-400 whitespace-nowrap">{item.timestamp}</td>
                        <td className="p-3 font-bold text-slate-900">{item.actorName}</td>
                        <td className="p-3">
                          <span className={`px-2 py-0.5 rounded-full text-[10px] border ${(ROLES[item.actorRole] || ROLES.user).badge}`}>
                            {(ROLES[item.actorRole] || ROLES.user).title}
                          </span>
                        </td>
                        <td className="p-3 font-semibold text-slate-700">{item.category}</td>
                        <td className="p-3 text-slate-800">{item.action}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* ВКЛАДКА 5: ТАБЛИЦА */}
          {activeTab === 'list' && (
            <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-xs">
              <table className="w-full text-left text-xs">
                <thead className="bg-slate-50 border-b border-slate-200 text-slate-500 font-bold uppercase text-[10px]">
                  <tr>
                    <th className="p-3.5">Бренд</th>
                    <th className="p-3.5">Этап</th>
                    <th className="p-3.5">Контакты</th>
                    <th className="p-3.5">Аренда</th>
                    <th className="p-3.5 text-right">Действия</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {filteredBrands.map(b => (
                    <tr key={b.id} className="hover:bg-slate-50/70">
                      <td className="p-3.5 font-bold text-slate-900">{b.name}</td>
                      <td className="p-3.5">{STAGES.find(s => s.id === b.stage)?.title}</td>
                      <td className="p-3.5">{b.tgUsername ? '@' + b.tgUsername : b.phone || '—'}</td>
                      <td className="p-3.5 font-bold">{(Number(b.monthlyFee) || 0).toLocaleString('ru-RU')} ₽</td>
                      <td className="p-3.5 text-right">
                        <button onClick={() => { setEditingBrand(b); setIsModalOpen(true); }} className="text-slate-500 hover:text-slate-900 mr-2 font-medium">Ред.</button>
                        <button onClick={() => setBrandToDelete(b)} className="text-rose-500 hover:text-rose-700 font-medium">Удалить</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          {/* ВКЛАДКА 6: ЧАТ И ГОЛОС */}
          {activeTab === 'assistant' && (
            <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-3">
              <h3 className="font-bold text-sm text-slate-900">Чат-ассистент</h3>
              <div className="h-64 overflow-y-auto bg-slate-50 p-3 rounded-xl space-y-2 text-xs">
                {assistantLogs.map(l => (
                  <div key={l.id} className={`p-2.5 rounded-xl ${l.sender === 'user' ? 'bg-slate-900 text-white ml-auto max-w-xs' : 'bg-white border text-slate-800 max-w-md'}`}>
                    {l.text}
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* ВКЛАДКА 7: ВХОДЯЩИЕ ИЗ ТГ */}
          {activeTab === 'telegram' && (
            <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-3">
              <h3 className="font-bold text-sm text-slate-900">Входящие сообщения из Telegram-бота</h3>
              <div className="space-y-2 max-h-96 overflow-y-auto">
                {tgUpdates.length === 0 ? (
                  <p className="text-xs text-slate-400 py-6 text-center">Сообщений пока нет</p>
                ) : (
                  tgUpdates.map(u => (
                    <div key={u.updateId} className="p-3 bg-slate-50 rounded-xl border border-slate-200 text-xs">
                      <div className="font-bold">{u.name} {u.username && `@${u.username}`}</div>
                      <div className="text-slate-700 mt-1">{u.text}</div>
                    </div>
                  ))
                )}
              </div>
            </div>
          )}

          {/* ВКЛАДКА 8: НАСТРОЙКИ */}
          {activeTab === 'guide' && isOwner && (
            <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-4 max-w-md">
              <h3 className="font-bold text-sm text-slate-900">⚙️ Настройки Telegram Bot</h3>
              <div>
                <label className="block text-xs font-semibold mb-1">Telegram Bot Token:</label>
                <input
                  type="text"
                  value={botToken}
                  onChange={e => setBotToken(e.target.value)}
                  className="w-full border rounded-xl p-2.5 text-xs font-mono"
                />
              </div>
            </div>
          )}

          {/* МОДАЛЬНОЕ ОКНО СОЗДАНИЯ / РЕДАКТИРОВАНИЯ БРЕНДА */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <form onSubmit={e => {
                e.preventDefault();
                const fd = new FormData(e.target);
                const curMonth = getCurrentMonthKey();
                const isPaidChecked = fd.get('isPaidThisMonth') === 'on';

                const data = {
                  id: editingBrand?.id || 'b-' + Date.now(),
                  name: fd.get('name').trim(),
                  category: fd.get('category').trim() || 'Одежда',
                  contactName: fd.get('contactName').trim(),
                  tgUsername: fd.get('tgUsername').trim().replace('@', ''),
                  phone: fd.get('phone').trim(),
                  stage: fd.get('stage'),
                  railFormat: fd.get('railFormat').trim() || '1 рейл',
                  monthlyFee: Number(fd.get('monthlyFee')) || 0,
                  commission: fd.get('commission').trim() || '25%',
                  paymentDay: Math.min(31, Math.max(1, Number(fd.get('paymentDay')) || 10)),
                  paidMonth: isPaidChecked ? curMonth : '',
                  lastContact: getTodayDateString(),
                  notes: fd.get('notes').trim()
                };

                if (editingBrand) {
                  setBrands(brands.map(b => b.id === data.id ? data : b));
                  addAuditLog('ДАННЫЕ БРЕНДОВ', `Отредактирован бренд «${data.name}»`);
                  showToast(`Бренд ${data.name} обновлен`);
                } else {
                  setBrands([data, ...brands]);
                  addAuditLog('ДАННЫЕ БРЕНДОВ', `Создан бренд «${data.name}»`);
                  showToast(`Бренд ${data.name} добавлен`);
                }
                setIsModalOpen(false);
                setEditingBrand(null);
              }} className="bg-white p-6 rounded-2xl w-full max-w-md space-y-3 text-xs shadow-2xl max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b border-slate-100 pb-2.5">
                  <h3 className="text-base font-bold text-slate-900">
                    {editingBrand ? `Редактировать: ${editingBrand.name}` : 'Добавить бренд'}
                  </h3>
                  <button
                    type="button"
                    onClick={() => { setIsModalOpen(false); setEditingBrand(null); }}
                    className="text-slate-400 hover:text-slate-700 text-sm font-bold px-1.5"
                  >
                    ✕
                  </button>
                </div>

                <div>
                  <label className="block font-semibold mb-1">Название бренда *</label>
                  <input name="name" defaultValue={editingBrand?.name || ''} required className="w-full border border-slate-200 rounded-lg p-2 outline-none focus:border-slate-900" />
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block font-semibold mb-1">Категория</label>
                    <input name="category" defaultValue={editingBrand?.category || 'Одежда / Streetwear'} className="w-full border border-slate-200 rounded-lg p-2 outline-none" />
                  </div>
                  <div>
                    <label className="block font-semibold mb-1">Контактное лицо</label>
                    <input name="contactName" defaultValue={editingBrand?.contactName || ''} placeholder="Имя менеджера" className="w-full border border-slate-200 rounded-lg p-2 outline-none" />
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block font-semibold mb-1">Telegram @username</label>
                    <input name="tgUsername" defaultValue={editingBrand?.tgUsername || ''} placeholder="username" className="w-full border border-slate-200 rounded-lg p-2 outline-none" />
                  </div>
                  <div>
                    <label className="block font-semibold mb-1">Телефон</label>
                    <input name="phone" defaultValue={editingBrand?.phone || ''} placeholder="+7..." className="w-full border border-slate-200 rounded-lg p-2 outline-none" />
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block font-semibold mb-1">Аренда (₽/мес)</label>
                    <input name="monthlyFee" type="number" defaultValue={editingBrand?.monthlyFee ?? 30000} className="w-full border border-slate-200 rounded-lg p-2 outline-none" />
                  </div>
                  <div>
                    <label className="block font-semibold mb-1">День оплаты (число 1–31)</label>
                    <input name="paymentDay" type="number" min="1" max="31" defaultValue={editingBrand?.paymentDay ?? 10} className="w-full border border-slate-200 rounded-lg p-2 outline-none" />
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block font-semibold mb-1">Этап воронки</label>
                    <select name="stage" defaultValue={editingBrand?.stage || 'lead'} className="w-full border border-slate-200 rounded-lg p-2 bg-white outline-none">
                      {STAGES.map(s => <option key={s.id} value={s.id}>{s.title}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block font-semibold mb-1">Формат рейлов</label>
                    <input name="railFormat" defaultValue={editingBrand?.railFormat || '1 рейл'} className="w-full border border-slate-200 rounded-lg p-2 outline-none" />
                  </div>
                </div>

                <div className="pt-1">
                  <label className="flex items-center gap-2 cursor-pointer bg-emerald-50 p-2.5 rounded-lg border border-emerald-200">
                    <input
                      type="checkbox"
                      name="isPaidThisMonth"
                      defaultChecked={editingBrand?.paidMonth === currentMonthKey}
                    />
                    <span className="font-bold text-emerald-900">Оплата за текущий месяц получена</span>
                  </label>
                </div>

                <div>
                  <label className="block font-semibold mb-1">Заметки</label>
                  <textarea name="notes" defaultValue={editingBrand?.notes || ''} rows="3" className="w-full border border-slate-200 rounded-lg p-2 outline-none"></textarea>
                </div>

                <div className="flex items-center justify-between gap-2 pt-3 border-t border-slate-100">
                  {editingBrand ? (
                    <button
                      type="button"
                      onClick={() => setBrandToDelete(editingBrand)}
                      className="px-3 py-2 bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 rounded-xl font-semibold flex items-center gap-1.5 transition"
                    >
                      <span>🗑 Удалить</span>
                    </button>
                  ) : <div />}

                  <div className="flex items-center gap-2">
                    <button
                      type="button"
                      onClick={() => { setIsModalOpen(false); setEditingBrand(null); }}
                      className="px-4 py-2 border border-slate-200 hover:bg-slate-50 rounded-xl font-medium"
                    >
                      Отмена
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-xl font-semibold transition"
                    >
                      Сохранить
                    </button>
                  </div>
                </div>
              </form>
            </div>
          )}

          {/* ДИАЛОГОВОЕ ОКНО ПОДТВЕРЖДЕНИЯ УДАЛЕНИЯ КАРТОЧКИ БРЕНДА */}
          {brandToDelete && (
            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4 z-[60]">
              <div className="bg-white rounded-2xl border border-slate-200 p-6 max-w-sm w-full shadow-2xl text-center space-y-4">
                <div className="w-12 h-12 rounded-2xl bg-rose-50 border border-rose-200 text-rose-600 flex items-center justify-center mx-auto text-xl">
                  🗑
                </div>
                <div className="space-y-1">
                  <h4 className="text-base font-bold text-slate-900">Удалить карточку бренда?</h4>
                  <p className="text-xs text-slate-500 leading-relaxed">
                    Вы действительно хотите удалить бренд <span className="font-bold text-slate-800">«{brandToDelete.name}»</span>?
                  </p>
                </div>
                <div className="flex items-center gap-2.5 pt-2">
                  <button
                    type="button"
                    onClick={() => setBrandToDelete(null)}
                    className="flex-1 py-2.5 px-4 rounded-xl border border-slate-200 hover:bg-slate-100 text-slate-700 font-semibold text-xs transition"
                  >
                    Отмена
                  </button>
                  <button
                    type="button"
                    onClick={confirmDeleteBrand}
                    className="flex-1 py-2.5 px-4 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs transition"
                  >
                    Да, удалить
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
