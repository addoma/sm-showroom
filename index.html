                      value={sttApiKey}
                      onChange={e => setSttApiKey(e.target.value)}
                      placeholder="gsk_... (бесплатный ключ с console.groq.com)"
                      className="w-full border rounded-xl p-2.5 font-mono text-xs"
                    />
                  </div>
                </div>

                <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs space-y-4 text-xs">
                  <h3 className="font-bold text-base text-slate-900">🚀 Настройка кнопки Mini App в 1 клик</h3>
                  <div>
                    <label className="block font-semibold mb-1">Ваша ссылка GitHub Pages (HTTPS):</label>
                    <input
                      type="url"
                      value={webAppUrl}
                      onChange={e => setWebAppUrl(e.target.value)}
                      className="w-full border rounded-xl p-2.5 font-mono text-xs"
                    />
                  </div>
                  <button
                    onClick={setupBotInTelegram}
                    className="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl transition shadow-xs"
                  >
                    Записать команды (/debts, /stats, /list) и кнопку Menu Button
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* МОДАЛЬНОЕ ОКНО СОЗДАНИЯ / РЕДАКТИРОВАНИЯ БРЕНДА */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <form onSubmit={handleSaveModal} className="bg-white p-6 rounded-2xl w-full max-w-md space-y-3 text-xs shadow-2xl max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b border-slate-100 pb-2.5">
                  <h3 className="text-base font-bold text-slate-900">
                    {editingBrand ? `Редактировать: ${editingBrand.name}` : 'Добавить бренд'}
                  </h3>
                  <button
                    type="button"
                    onClick={() => { setIsModalOpen(false); setEditingBrand(null); }}
                    className="text-slate-400 hover:text-slate-700 text-sm font-bold px-1.5"
                  >
                    ✕
                  </button>
                </div>

                <div>
                  <label className="block font-semibold mb-1">Название бренда *</label>
                  <input name="name" defaultValue={editingBrand?.name || ''} required className="w-full border border-slate-200 rounded-lg p-2 outline-none focus:border-slate-900" />
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block font-semibold mb-1">Категория</label>
                    <input name="category" defaultValue={editingBrand?.category || 'Одежда / Streetwear'} className="w-full border border-slate-200 rounded-lg p-2 outline-none" />
                  </div>
                  <div>
                    <label className="block font-semibold mb-1">Контактное лицо</label>
                    <input name="contactName" defaultValue={editingBrand?.contactName || ''} placeholder="Имя менеджера" className="w-full border border-slate-200 rounded-lg p-2 outline-none" />
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block font-semibold mb-1">Telegram @username</label>
                    <input name="tgUsername" defaultValue={editingBrand?.tgUsername || ''} placeholder="username" className="w-full border border-slate-200 rounded-lg p-2 outline-none" />
                  </div>
                  <div>
                    <label className="block font-semibold mb-1">Телефон</label>
                    <input name="phone" defaultValue={editingBrand?.phone || ''} placeholder="+7..." className="w-full border border-slate-200 rounded-lg p-2 outline-none" />
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block font-semibold mb-1">Аренда (₽/мес)</label>
                    <input name="monthlyFee" type="number" defaultValue={editingBrand?.monthlyFee ?? 30000} className="w-full border border-slate-200 rounded-lg p-2 outline-none" />
                  </div>
                  <div>
                    <label className="block font-semibold mb-1">День оплаты (число 1–31)</label>
                    <input name="paymentDay" type="number" min="1" max="31" defaultValue={editingBrand?.paymentDay ?? 10} className="w-full border border-slate-200 rounded-lg p-2 outline-none" />
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block font-semibold mb-1">Этап воронки</label>
                    <select name="stage" defaultValue={editingBrand?.stage || 'lead'} className="w-full border border-slate-200 rounded-lg p-2 bg-white outline-none">
                      {STAGES.map(s => <option key={s.id} value={s.id}>{s.title}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block font-semibold mb-1">Формат рейлов</label>
                    <input name="railFormat" defaultValue={editingBrand?.railFormat || '1 рейл'} className="w-full border border-slate-200 rounded-lg p-2 outline-none" />
                  </div>
                </div>

                <div className="pt-1">
                  <label className="flex items-center gap-2 cursor-pointer bg-emerald-50 p-2.5 rounded-lg border border-emerald-200">
                    <input
                      type="checkbox"
                      name="isPaidThisMonth"
                      defaultChecked={editingBrand?.paidMonth === currentMonthKey}
                    />
                    <span className="font-bold text-emerald-900">Оплата за текущий месяц ({currentMonthKey}) получена</span>
                  </label>
                </div>

                <div>
                  <label className="block font-semibold mb-1">Заметки и история переговоров</label>
                  <textarea name="notes" defaultValue={editingBrand?.notes || ''} rows="3" className="w-full border border-slate-200 rounded-lg p-2 outline-none"></textarea>
                </div>

                <div className="flex items-center justify-between gap-2 pt-3 border-t border-slate-100">
                  {editingBrand ? (
                    <button
                      type="button"
                      onClick={() => requestDeleteBrand(editingBrand.id)}
                      className="px-3 py-2 bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 rounded-xl font-semibold flex items-center gap-1.5 transition"
                      title="Удалить карточку бренда"
                    >
                      <svg xmlns="http://www.w3.org/2000/svg" className="w-4 h-4 text-rose-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                        <path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                      </svg>
                      <span>Удалить</span>
                    </button>
                  ) : (
                    <div />
                  )}

                  <div className="flex items-center gap-2">
                    <button
                      type="button"
                      onClick={() => { setIsModalOpen(false); setEditingBrand(null); }}
                      className="px-4 py-2 border border-slate-200 hover:bg-slate-50 rounded-xl font-medium"
                    >
                      Отмена
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-xl font-semibold transition"
                    >
                      Сохранить
                    </button>
                  </div>
                </div>
              </form>
            </div>
          )}

          {/* ДИАЛОГОВОЕ ОКНО ПОДТВЕРЖДЕНИЯ УДАЛЕНИЯ КАРТОЧКИ БРЕНДА */}
          {brandToDelete && (
            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4 z-[60]">
              <div className="bg-white rounded-2xl border border-slate-200 p-6 max-w-sm w-full shadow-2xl text-center space-y-4 animate-in fade-in zoom-in-95 duration-150">
                <div className="w-12 h-12 rounded-2xl bg-rose-50 border border-rose-200 text-rose-600 flex items-center justify-center mx-auto">
                  <svg xmlns="http://www.w3.org/2000/svg" className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                    <path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                  </svg>
                </div>
                <div className="space-y-1">
                  <h4 className="text-base font-bold text-slate-900">Удалить карточку бренда?</h4>
                  <p className="text-xs text-slate-500 leading-relaxed">
                    Вы действительно хотите безвозвратно удалить бренд <span className="font-bold text-slate-800">«{brandToDelete.name}»</span> и всю историю заметок по нему?
                  </p>
                </div>
                <div className="flex items-center gap-2.5 pt-2">
                  <button
                    type="button"
                    onClick={() => setBrandToDelete(null)}
                    className="flex-1 py-2.5 px-4 rounded-xl border border-slate-200 hover:bg-slate-100 text-slate-700 font-semibold text-xs transition"
                  >
                    Отмена
                  </button>
                  <button
                    type="button"
                    onClick={confirmDeleteBrand}
                    className="flex-1 py-2.5 px-4 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs shadow-sm transition"
                  >
                    Да, удалить
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* МОДАЛЬНОЕ ОКНО ПЕРВИЧНОЙ МИГРАЦИИ (ANTI-WIPE GUARD & BACKUP) */}
          {isMigrationModalOpen && (
            <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-xs flex items-center justify-center p-4 z-[70]">
              <div className="bg-white rounded-2xl border border-slate-200 p-6 max-w-lg w-full shadow-2xl space-y-4 animate-in fade-in zoom-in-95 duration-150">
                <div className="flex items-center gap-3">
                  <div className="w-12 h-12 rounded-2xl bg-amber-50 border border-amber-200 text-amber-600 flex items-center justify-center text-2xl flex-shrink-0">
                    ☁️
                  </div>
                  <div>
                    <h4 className="text-base font-bold text-slate-900">Инициализация Google Таблицы</h4>
                    <p className="text-xs text-slate-500">Обнаружена пустая таблица и локальные данные</p>
                  </div>
                </div>

                <div className="bg-slate-50 border border-slate-200 rounded-xl p-3.5 space-y-2 text-xs text-slate-700">
                  <div className="font-semibold text-slate-900 flex items-center gap-1.5">
                    <span>🛡 Защита от затирания (Anti-Wipe Guard) активна</span>
                  </div>
                  <p>
                    В вашей Google Таблице пока нет сохраненных брендов (0 записей). При этом в локальном хранилище вашего устройства обнаружены реальные данные:
                  </p>
                  <ul className="list-disc list-inside space-y-1 font-mono text-[11px] text-slate-600">
                    <li><strong>{brands.length}</strong> брендов в шоуруме</li>
                    <li><strong>{aclUsers.length}</strong> участников ролевой модели (ACL)</li>
                    <li><strong>{auditLogs.length}</strong> записей аудита</li>
                  </ul>
                  <p className="text-[11px] text-slate-500 pt-1">
                    Чтобы сохранить 100% гарантию от сбоев, скачайте резервную копию JSON и выгрузите базу в Google Таблицу.
                  </p>
                </div>

                <div className="space-y-2 pt-1">
                  <button
                    type="button"
                    onClick={performInitialMigration}
                    className="w-full py-2.5 px-4 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl text-xs transition flex items-center justify-center gap-2 shadow-sm"
                  >
                    <span>⬆️ Выгрузить все данные в Google Таблицу</span>
                  </button>
                  <button
                    type="button"
                    onClick={openBackupModal}
                    className="w-full py-2.5 px-4 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-200 font-bold rounded-xl text-xs transition flex items-center justify-center gap-2"
                  >
                    <span>📥 Резервная копия JSON</span>
                  </button>
                  <button
                    type="button"
                    onClick={() => setIsMigrationModalOpen(false)}
                    className="w-full py-2 px-4 border border-slate-200 hover:bg-slate-100 text-slate-600 font-semibold rounded-xl text-xs transition"
                  >
                    Продолжить работу в локальном кэше
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* МОДАЛЬНОЕ ОКНО РЕЗЕРВНОЙ КОПИИ ДЛЯ iOS & TELEGRAM MINI APP */}
          {isBackupModalOpen && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4 z-[80]">
              <div className="bg-white rounded-3xl border border-slate-200 p-5 sm:p-6 max-w-md w-full shadow-2xl space-y-4 animate-in fade-in zoom-in-95 duration-150 max-h-[92vh] overflow-y-auto">
                {/* Шапка модалки */}
                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                  <div className="flex items-center gap-2.5">
                    <div className="w-10 h-10 rounded-2xl bg-emerald-50 border border-emerald-200 text-emerald-600 flex items-center justify-center text-xl flex-shrink-0">
                      📦
                    </div>
                    <div>
                      <h3 className="text-base font-bold text-slate-900 leading-tight">Резервная копия базы CRM</h3>
                      <p className="text-[11px] text-slate-500 font-medium">Адаптировано для iPhone & Telegram</p>
                    </div>
                  </div>
                  <button
                    type="button"
                    onClick={() => setIsBackupModalOpen(false)}
                    className="text-slate-400 hover:text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-full w-8 h-8 flex items-center justify-center text-sm font-bold transition"
                  >
                    ✕
                  </button>
                </div>

                {/* Информационная карточка */}
                <div className="bg-slate-50 border border-slate-200 rounded-2xl p-3.5 space-y-1.5 text-xs text-slate-700">
                  <div className="font-semibold text-slate-900 flex items-center justify-between">
                    <span>Снимок состояния CRM:</span>
                    <span className="text-[10px] text-slate-400 font-mono">{new Date().toLocaleDateString('ru-RU')}</span>
                  </div>
                  <div className="grid grid-cols-3 gap-2 pt-1">
                    <div className="bg-white p-2 rounded-xl border border-slate-200 text-center">
                      <div className="text-[10px] text-slate-400">Брендов</div>
                      <div className="text-sm font-bold text-slate-900">{brands.length}</div>
                    </div>
                    <div className="bg-white p-2 rounded-xl border border-slate-200 text-center">
                      <div className="text-[10px] text-slate-400">Доступов</div>
                      <div className="text-sm font-bold text-slate-900">{aclUsers.length}</div>
                    </div>
                    <div className="bg-white p-2 rounded-xl border border-slate-200 text-center">
                      <div className="text-[10px] text-slate-400">Логов</div>
                      <div className="text-sm font-bold text-slate-900">{auditLogs.length}</div>
                    </div>
                  </div>
                </div>

                {/* Основные варианты экспорта для iOS */}
                <div className="space-y-2 pt-1">
                  {/* Кнопка 1: Отправка в Telegram */}
                  <button
                    type="button"
                    disabled={isSendingBackup}
                    onClick={handleSendBackupToTelegram}
                    className="w-full py-3 px-4 bg-sky-600 hover:bg-sky-500 active:scale-[0.98] text-white font-bold rounded-2xl text-xs transition flex items-center justify-between shadow-sm"
                  >
                    <div className="flex items-center gap-2.5 text-left">
                      <span className="text-base">✈️</span>
                      <div>
                        <div>Отправить файл в Telegram</div>
                        <div className="text-[10px] font-normal text-sky-100">Файл .json придет документом в диалог с ботом</div>
                      </div>
                    </div>
                    <span className="text-xs">{isSendingBackup ? '⏳...' : '→'}</span>
                  </button>

                  {/* Кнопка 2: Нативное меню "Поделиться" iOS */}
                  <button
                    type="button"
                    onClick={handleShareViaIOS}
                    className="w-full py-3 px-4 bg-slate-900 hover:bg-slate-800 active:scale-[0.98] text-white font-bold rounded-2xl text-xs transition flex items-center justify-between shadow-sm"
                  >
                    <div className="flex items-center gap-2.5 text-left">
                      <span className="text-base">📱</span>
                      <div>
                        <div>Сохранить в «Файлы» (iOS Share)</div>
                        <div className="text-[10px] font-normal text-slate-300">Открыть системное меню iOS (AirDrop, iCloud, Файлы)</div>
                      </div>
                    </div>
                    <span className="text-xs">→</span>
                  </button>

                  {/* Кнопка 3: Копирование в буфер обмена */}
                  <button
                    type="button"
                    onClick={handleCopyBackupToClipboard}
                    className={`w-full py-3 px-4 rounded-2xl text-xs font-bold transition flex items-center justify-between border ${
                      copiedBackup
                        ? 'bg-emerald-50 text-emerald-800 border-emerald-300'
                        : 'bg-white hover:bg-slate-50 text-slate-800 border-slate-200'
                    }`}
                  >
                    <div className="flex items-center gap-2.5 text-left">
                      <span className="text-base">{copiedBackup ? '✅' : '📋'}</span>
                      <div>
                        <div>{copiedBackup ? 'JSON скопирован в буфер!' : 'Скопировать весь JSON'}</div>
                        <div className="text-[10px] font-normal text-slate-500">Вставить в «Заметки» или любой мессенджер</div>
                      </div>
                    </div>
                    <span className="text-xs">{copiedBackup ? 'Готово' : 'Копировать'}</span>
                  </button>

                  {/* Кнопка 4: Прямое скачивание для ПК / внешних браузеров */}
                  <button
                    type="button"
                    onClick={handleDirectBrowserDownload}
                    className="w-full py-2 px-4 rounded-xl text-[11px] font-semibold text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition flex items-center justify-center gap-1.5"
                  >
                    <span>💾 Скачать файл напрямую (для ПК)</span>
                  </button>
                </div>

                {/* Раскрывающийся блок просмотра JSON */}
                <div className="pt-1">
                  <button
                    type="button"
                    onClick={() => setShowRawJson(prev => !prev)}
                    className="w-full text-center text-xs text-slate-500 hover:text-slate-900 font-semibold py-1 flex items-center justify-center gap-1"
                  >
                    <span>{showRawJson ? 'Скрыть код JSON' : 'Показать код JSON вручную'}</span>
                    <span className={`text-[10px] transition-transform ${showRawJson ? 'rotate-180' : ''}`}>▾</span>
                  </button>

                  {showRawJson && (
                    <div className="mt-2 space-y-2">
                      <textarea
                        readOnly
                        rows={6}
                        value={generateBackupData().jsonStr}
                        className="w-full bg-slate-900 text-sky-300 font-mono text-[10px] p-3 rounded-xl outline-none select-all"
                        onClick={e => e.target.select()}
                      />
                      <button
                        type="button"
                        onClick={handleCopyBackupToClipboard}
                        className="w-full py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-xs transition"
                      >
                        📋 Выделить и скопировать всё
                      </button>
                    </div>
                  )}
                </div>

                {/* Кнопка выхода */}
                <div className="pt-2 border-t border-slate-100">
                  <button
                    type="button"
                    onClick={() => setIsBackupModalOpen(false)}
                    className="w-full py-2.5 border border-slate-200 hover:bg-slate-100 text-slate-700 font-bold rounded-xl text-xs transition"
                  >
                    Закрыть окно бэкапа
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
